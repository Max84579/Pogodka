<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Погода в Липецке</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #2d3436;
  }
  .card {
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    padding: 32px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .subtitle { color: #636e72; font-size: 14px; margin-bottom: 24px; }
  .now {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .now .temp { font-size: 64px; font-weight: 300; line-height: 1; }
  .now .desc { font-size: 16px; color: #636e72; margin-top: 6px; }
  .now .icon { font-size: 72px; }
  .details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
    font-size: 14px;
  }
  .details div {
    background: #f1f2f6;
    padding: 12px 14px;
    border-radius: 12px;
  }
  .details span { color: #636e72; display: block; margin-bottom: 2px; }
  h2 { font-size: 16px; margin-bottom: 12px; color: #2d3436; }
  .forecast { display: flex; flex-direction: column; gap: 8px; }
  .day {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: #f1f2f6;
    border-radius: 12px;
    font-size: 14px;
  }
  .day .name { flex: 1; }
  .day .ic { font-size: 20px; margin: 0 10px; }
  .day .t { font-weight: 600; min-width: 60px; text-align: right; }
  .status { text-align: center; color: #636e72; font-size: 14px; }
  .error { color: #d63031; text-align: center; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Погода в Липецке</h1>
    <div class="subtitle" id="date">Загрузка...</div>

    <div id="status" class="status">Загрузка данных...</div>

    <div id="content" style="display:none;">
      <div class="now">
        <div>
          <div class="temp" id="temp">—</div>
          <div class="desc" id="desc">—</div>
        </div>
        <div class="icon" id="icon">—</div>
      </div>

      <div class="details">
        <div><span>Ветер</span><b id="wind">—</b></div>
        <div><span>Влажность</span><b id="humidity">—</b></div>
        <div><span>Давление</span><b id="pressure">—</b></div>
        <div><span>Ощущается</span><b id="feels">—</b></div>
      </div>

      <h2>Прогноз на 7 дней</h2>
      <div class="forecast" id="forecast"></div>
    </div>

    <div class="error" id="error"></div>
  </div>

<script>
const LAT = 52.6089;
const LON = 39.5995;

const weatherIcons = {
  0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️",
  45: "🌫️", 48: "🌫️",
  51: "🌦️", 53: "🌦️", 55: "🌦️",
  61: "🌧️", 63: "🌧️", 65: "🌧️",
  71: "🌨️", 73: "🌨️", 75: "🌨️",
  80: "🌧️", 81: "🌧️", 82: "⛈️",
  95: "⛈️", 96: "⛈️", 99: "⛈️"
};

const weatherDesc = {
  0: "Ясно", 1: "Преимущественно ясно", 2: "Переменная облачность", 3: "Пасмурно",
  45: "Туман", 48: "Туман с изморозью",
  51: "Слабая морось", 53: "Морось", 55: "Сильная морось",
  61: "Небольшой дождь", 63: "Дождь", 65: "Сильный дождь",
  71: "Небольшой снег", 73: "Снег", 75: "Сильный снег",
  80: "Ливни", 81: "Сильные ливни", 82: "Очень сильные ливни",
  95: "Гроза", 96: "Гроза с градом", 99: "Сильная гроза с градом"
};

async function loadWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,surface_pressure` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
      `&timezone=Europe/Moscow&forecast_days=7`;

    const res = await fetch(url);
    if (!res.ok) throw new Error("Ошибка сети");
    const data = await res.json();

    const cur = data.current;
    document.getElementById("temp").textContent = Math.round(cur.temperature_2m) + "°";
    document.getElementById("desc").textContent = weatherDesc[cur.weather_code] || "—";
    document.getElementById("icon").textContent = weatherIcons[cur.weather_code] || "❓";
    document.getElementById("wind").textContent = cur.wind_speed_10m + " м/с";
    document.getElementById("humidity").textContent = cur.relative_humidity_2m + "%";
    document.getElementById("pressure").textContent = Math.round(cur.surface_pressure * 0.75006) + " мм";
    document.getElementById("feels").textContent = Math.round(cur.apparent_temperature) + "°";

    const days = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
    const forecastEl = document.getElementById("forecast");
    forecastEl.innerHTML = "";

    for (let i = 0; i < data.daily.time.length; i++) {
      const d = new Date(data.daily.time[i]);
      const name = i === 0 ? "Сегодня" : days[d.getDay()];
      const code = data.daily.weather_code[i];
      const max = Math.round(data.daily.temperature_2m_max[i]);
      const min = Math.round(data.daily.temperature_2m_min[i]);

      const row = document.createElement("div");
      row.className = "day";
      row.innerHTML = `
        <span class="name">${name}</span>
        <span class="ic">${weatherIcons[code] || "❓"}</span>
        <span class="t">${max}° / ${min}°</span>
      `;
      forecastEl.appendChild(row);
    }

    const now = new Date();
    document.getElementById("date").textContent =
      now.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });

    document.getElementById("status").style.display = "none";
    document.getElementById("content").style.display = "block";
  } catch (e) {
    document.getElementById("status").style.display = "none";
    document.getElementById("error").textContent = "Не удалось загрузить погоду: " + e.message;
  }
}

loadWeather();
setInterval(loadWeather, 10 * 60 * 1000);
</script>
</body>
</html>
